services:
  db:
    image: postgres:16
    container_name: umir-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cafe
      POSTGRES_USER: api
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api -d cafe"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: umir-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=cafe;Username=api;Password=123;"
    ports:
      - "5094:8080"

volumes:
  pgdata:
